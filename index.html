<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- desktop app (Tauri): flag it before first paint so the page starts transparent -->
    <script>if ('__TAURI_INTERNALS__' in window) document.documentElement.dataset.app = '1'</script>
    <!-- theme before first paint (no flash): ?theme= wins, then the saved preference (atlas.theme.v1), then the system appearance. Keep in step with src/theme/theme.ts -->
    <script>
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme'), p
        try { p = localStorage.getItem('atlas.theme.v1') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var d = document.documentElement
        d.dataset.theme = t
        d.style.colorScheme = t
        document.write('<meta name="theme-color" content="' + (t === 'light' ? '#e4e8ea' : '#1d2124') + '" />')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Nanoscale Revision — the CMOS inverter, from wafer to atoms</title>
    <meta name="description" content="An explorable 3D model of the CMOS inverter from ELEC0031 Topic 2: wafer, die, cell, transistor, gate oxide and silicon lattice, built from the six masks and the fab recipe." />
    <meta property="og:title" content="Nanoscale Revision — the CMOS inverter" />
    <meta property="og:description" content="Zoom from a 300 mm wafer to the 5.43 Å silicon lattice. Cut the inverter along the slide 27 line. Replay the fab sequence step by step." />
    <meta property="og:image" content="/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
