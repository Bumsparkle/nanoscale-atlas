<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Nanoscale Atlas app icon: the site's brand mark (a silicon block under an
       amber resist stripe) as a lit isometric cell on the instrument-grey panel -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3135"/>
      <stop offset="1" stop-color="#16191b"/>
    </linearGradient>
    <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c7882"/>
      <stop offset="1" stop-color="#4b555e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc85a"/>
      <stop offset="1" stop-color="#e3a12c"/>
    </linearGradient>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <g clip-path="url(#sq)" stroke="#a9b3b9" stroke-opacity="0.09" stroke-width="3">
    <path d="M100 300h824M100 420h824M100 540h824M100 660h824M100 780h824M260 100v824M380 100v824M500 100v824M620 100v824M740 100v824"/>
  </g>
  <!-- isometric silicon block -->
  <g transform="translate(512 560)">
    <path d="M0 -150 L260 0 L0 150 L-260 0 Z" fill="url(#top)"/>
    <path d="M-260 0 L0 150 L0 290 L-260 140 Z" fill="#3a434a"/>
    <path d="M260 0 L0 150 L0 290 L260 140 Z" fill="#2c3338"/>
    <!-- n-well and diffusions on the top face -->
    <path d="M40 -127 L190 -40 L60 35 L-90 -52 Z" fill="#3f5a6c"/>
    <path d="M-150 -17 L-95 15 L-140 41 L-195 9 Z" fill="#5b88ad"/>
    <path d="M120 -62 L175 -30 L130 -4 L75 -36 Z" fill="#a07a55"/>
    <!-- the amber gate stripe, lying across the top face -->
    <path d="M-150 -62 L120 94 L120 60 L-150 -96 Z" fill="#b97d1c"/>
    <path d="M120 94 L156 73 L156 39 L120 60 Z" fill="#8a5c14"/>
    <path d="M-150 -96 L120 60 L156 39 L-114 -117 Z" fill="url(#amber)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>
</svg>
