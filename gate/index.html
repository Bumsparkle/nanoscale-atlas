<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- theme before first paint, as in /index.html (keep in step with src/theme/theme.ts) -->
    <script>
      ;(function () {
        var t = new URLSearchParams(location.search).get('theme'), p
        try { p = localStorage.getItem('atlas.theme.v1') } catch (e) {}
        if (t !== 'light' && t !== 'dark') t = p === 'light' || p === 'dark' ? p : matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'
        var d = document.documentElement
        d.dataset.theme = t
        d.style.colorScheme = t
        document.write('<meta name="theme-color" content="' + (t === 'light' ? '#e4e8ea' : '#1d2124') + '" />')
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Nanoscale Revision — access</title>
    <meta property="og:title" content="Nanoscale Revision" />
    <meta property="og:image" content="/og.png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/gate/main.tsx"></script>
  </body>
</html>
